manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: pachterlab/seqspec
    source: https://github.com/pachterlab/seqspec
    branch: main
    commit: "fba4255b"
    scope: [seqspec/Assay.py, seqspec/seqspec_build.py, seqspec/seqspec_check.py, seqspec/seqspec_format.py, seqspec/seqspec_init.py,
      seqspec/seqspec_insert.py, seqspec/seqspec_modify.py, seqspec/utils.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:11:05Z'
  signatures:
    digest: sha256:6mMLs7yvqhxQ_fl2cfWGNbDOiVjPMb5lfEsE0lvzGqA
    key: ed25519:ooN2gEDjslTmmN02eIZRHuAyDNwiKPqF0zFoJzFZRWQ
    sig: ed25519:h9rrHEY8vunakhmo_wNUhrzmEabRraWjXZNdYiTkEiKN2P962sW5kFIMfik9KtUw1k0IX9pFLVkQ75Q-3PqyAA

agents:
  agent:
    type: instance
    models: [o4-mini]
    tools: [seqspec_check, seqspec_insert_reads, seqspec_insert_regions, seqspec_modify_read, seqspec_modify_region, seqspec_format]
    params:
      function: seqspec_build_async
      name: seqspec agent
      output_type: Assay
      model_settings: ModelSettings(temperature=1, tool_choice=auto)
      instructions: [Use the given tools to build a correct and complete seqspec file., Do not hallucinate any data that is
          not provided., The list of the top-most regions in the library_spec have region_ids that correspond to the "modality".,
        Add the sequencing library structure with seqspec_insert_region., 'After, add the sequencing reads with seqspec_insert_read.',
        Check the file with seqspec_check., Modify attributes of any elements with seqspec_modify if necessary., 'At the very
          end, run seqspec_format then return the final spec.']

models:
  o4-mini:
    type: literal
    agents: [agent]

tools:
  seqspec_check:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_check
      description: |-
        Core functionality to check a seqspec and return filtered errors.

        Args:
            spec: The Assay object to check
            filter_type: Optional filter type to apply to errors (e.g. "igvf", "igvf_onlist_skip")

        Returns:
            List of error dictionaries
  seqspec_format:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_format
      description: |-
        Format a seqspec specification by updating its fields.

        Args:
            spec: The seqspec specification to format.
  seqspec_insert_reads:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_insert_reads
      description: |-
        Insert reads into the spec for the given modality.

        Converts each ``ReadInput`` to a ``Read`` and inserts them into the
        ``sequence_spec`` via ``Assay.insert_reads``. If ``after`` is provided, the
        reads are inserted immediately after the read with ID ``after``; otherwise,
        they are inserted at the beginning.

        Args:
            spec: The ``Assay`` to modify. Mutated in place and returned.
            modality: Target modality under which the reads should be inserted.
            reads: A list of ``ReadInput`` objects to insert.
            after: Optional read ID. When provided, insert after this read; when
                ``None``, insert at the start of the reads for the assay.

        Returns:
            The same ``Assay`` instance with reads inserted.

        Example:
            >>> seqspec_insert_reads(spec, "rna", [ReadInput(read_id="R2")], after="R1")
  seqspec_insert_regions:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_insert_regions
      description: |-
        Insert regions into the library spec for the given modality.

        Converts each ``RegionInput`` to a ``Region`` and inserts them into the
        modality's library via ``Assay.insert_regions``. If ``after`` is provided,
        the regions are inserted immediately after the region with ID ``after``;
        otherwise, they are inserted at the beginning. The library attributes are
        updated by ``Assay.insert_regions``.

        Args:
            spec: The ``Assay`` to modify. Mutated in place and returned.
            modality: Target modality under which the regions should be inserted.
            regions: A list of ``RegionInput`` objects to insert.
            after: Optional region ID. When provided, insert after this region;
                when ``None``, insert at the start of the modality's library.

        Returns:
            The same ``Assay`` instance with regions inserted.

        Example:
            >>> seqspec_insert_regions(spec, "rna", [RegionInput(region_id="new_bc")], after="rna_primer")
  seqspec_modify:
    type: wrapper
    params:
      wraps: seqspec_modify
      description: |-
        Modify a loaded spec in-place according to selector-specific updates.

        This is the core implementation behind the ``seqspec modify`` CLI.
        It dispatches to a section-specific updater based on ``selector`` and
        applies partial updates to items identified by their stable IDs. Only
        fields present in each input object and not ``None`` are applied.

        Args:
            spec: Parsed ``Assay`` object to modify. Mutated in place and returned.
            modality: Target modality within the spec (for example, "rna", "atac").
            keys: List of JSON-like dictionaries describing updates. Each dict must
                include the identifying field for the chosen ``selector``:
                - selector == "read": use "read_id"
                - selector == "region": use "region_id"
                - selector == "file": use "file_id"
                - selector == "seqkit": use "kit_id"
                - selector == "seqprotocol": use "protocol_id"
                - selector == "libkit": use "kit_id"
                - selector == "libprotocol": use "protocol_id"
                - selector == "assay": use "assay_id" (must match ``spec.assay_id``)
            selector: Section of the spec to modify. See ``Selector`` enum.

        Returns:
            The same ``Assay`` instance with updates applied.

        Notes:
            - Read updates support the optional "files" field; when provided, the
              inputs are converted to ``File`` models before assignment.
            - Region updates are applied via ``Region.update_region_by_id`` within
              the library spec of the given modality.
            - Sequence/Library kits and protocols are updated field-by-field when
              the item with the matching ID is found; unknown IDs are ignored.
            - Unknown or missing identifiers in ``keys`` are skipped without error.

        Examples:
            Update a read name:
                >>> seqspec_modify(spec, "rna", [{"read_id": "rna_R1", "name": "R1_renamed"}], "read")

            Update a region sequence:
                >>> seqspec_modify(spec, "rna", [{"region_id": "rna_cell_bc", "sequence": "NNNN"}], "region")

            Update an assay description:
                >>> seqspec_modify(spec, "rna", [{"assay_id": spec.assay_id, "description": "New desc"}], "assay")
  seqspec_modify_read:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_modify_read
      description: Modify read properties in spec using ``ReadInput`` objects.
  seqspec_modify_region:
    type: wrapper
    agents: [agent]
    params:
      wraps: seqspec_modify_region
      description: Modify region properties in spec using ``RegionInput`` objects.

